<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Anamika Yadav</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<style>
  .nf{ min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px; position:relative; overflow:hidden; }
  .nf .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.2; width:460px; height:460px; background:var(--accent); top:-160px; right:-120px; }
  .nf-inner{ position:relative; z-index:1; max-width:560px; }
  .nf-code{ font-family:var(--scribble); font-size:clamp(90px,18vw,180px); line-height:.9; color:var(--accent-strong); font-weight:700; }
  .nf h1{ font-size:clamp(26px,4vw,38px); font-weight:800; margin:18px 0 14px; }
  .nf p{ color:var(--ink-soft); font-size:16.5px; margin-bottom:34px; }
  .nf .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="nf">
  <span class="blob" aria-hidden="true"></span>
  <div class="nf-inner">
    <div class="nf-code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The link you followed doesn't exist — or it moved. Everything worth seeing is one click away.</p>
    <div class="btn-row">
      <a href="/" class="btn btn-primary">Back to the portfolio</a>
      <a href="/#work" class="btn btn-ghost">See the work</a>
    </div>
  </div>
</div>
</body>
</html>
